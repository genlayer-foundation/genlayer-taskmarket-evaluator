AWSTemplateFormatVersion: '2010-09-09'
Description: Private host and recovery storage for the GenLayer Taskmarket testnet evaluator.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  Ami:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
Resources:
  Images:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Ref AWS::StackName
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
  Backups:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${AWS::StackName}-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration: {Status: Enabled}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      LifecycleConfiguration:
        Rules:
          - Id: JournalVersions
            Prefix: backups/
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 30}
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Backups
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt Backups.Arn, !Sub '${Backups.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
  Receipts:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-receipts-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
  ReceiptOrigin:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-receipts'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  ReceiptDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Internet Court Taskmarket landing page and settlement explorer
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: receipts
            DomainName: !GetAtt Receipts.RegionalDomainName
            OriginAccessControlId: !GetAtt ReceiptOrigin.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: receipts
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ExplorerRoute.FunctionARN
        CacheBehaviors:
          - PathPattern: '/cases/*'
            TargetOriginId: receipts
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
  ExplorerRoute:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-explorer'
      AutoPublish: true
      FunctionConfig:
        Comment: Route the public explorer to its static document
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri === '/explorer' || request.uri === '/explorer/') {
            request.uri = '/explorer.html';
          }
          if (request.uri === '/case' || request.uri === '/case/') {
            request.uri = '/case.html';
          }
          return request;
        }
  ReceiptReadPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Receipts
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource:
              - !Sub '${Receipts.Arn}/completed.json'
              - !Sub '${Receipts.Arn}/index.html'
              - !Sub '${Receipts.Arn}/explorer.html'
              - !Sub '${Receipts.Arn}/case.html'
              - !Sub '${Receipts.Arn}/cases/*'
              - !Sub '${Receipts.Arn}/assets/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${ReceiptDistribution}'
  HostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['ssm:UpdateInstanceInformation', 'ssmmessages:CreateControlChannel', 'ssmmessages:CreateDataChannel', 'ssmmessages:OpenControlChannel', 'ssmmessages:OpenDataChannel', 'ecr:GetAuthorizationToken']
                Resource: '*'
              - Effect: Allow
                Action: ['ecr:BatchGetImage', 'ecr:GetDownloadUrlForLayer', 'ecr:BatchCheckLayerAvailability']
                Resource: !GetAtt Images.Arn
              - Effect: Allow
                Action: 'secretsmanager:GetSecretValue'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}/evaluator-??????'
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}/mainnet-evaluator-??????'
              - Effect: Allow
                Action: s3:GetObject
                Resource: [!Sub '${Backups.Arn}/release/*', !Sub '${Backups.Arn}/backups/journal.sqlite', !Sub '${Backups.Arn}/backups/mainnet.sqlite']
              - Effect: Allow
                Action: s3:PutObject
                Resource: [!Sub '${Backups.Arn}/backups/journal.sqlite', !Sub '${Backups.Arn}/backups/mainnet.sqlite', !Sub '${Receipts.Arn}/completed.json']
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${Receipts.Arn}/cases/*'
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition: {StringEquals: {'cloudwatch:namespace': 'GenLayer/Taskmarket'}}
  Profile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref HostRole]}
  Group:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound-only evaluator, managed through Systems Manager
      VpcId: !Ref VpcId
  Host:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t4g.small
      ImageId: !Ref Ami
      IamInstanceProfile: !Ref Profile
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: false
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref Group]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeType: gp3, VolumeSize: 16, Encrypted: true, DeleteOnTermination: false}
      MetadataOptions: {HttpTokens: required, HttpEndpoint: enabled, HttpPutResponseHopLimit: 1}
      Tags:
        - {Key: Name, Value: !Ref AWS::StackName}
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -eu
          dnf -y install docker
          systemctl enable --now docker
  Health:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-worker-health'
      AlarmDescription: The evaluator or journal backup is unhealthy, or host metrics stopped.
      Namespace: GenLayer/Taskmarket
      MetricName: Healthy
      Dimensions: [{Name: Service, Value: !Ref AWS::StackName}]
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
  Deadline:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-review-deadline'
      AlarmDescription: A tracked job needs review or has fewer than two hours before its evaluator deadline.
      Namespace: GenLayer/Taskmarket
      MetricName: NeedsAttention
      Dimensions: [{Name: Service, Value: !Ref AWS::StackName}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
Outputs:
  PublicSite: {Value: !Sub 'https://${ReceiptDistribution.DomainName}'}
  ReceiptFeed: {Value: !Sub 'https://${ReceiptDistribution.DomainName}/completed.json'}
  HostId: {Value: !Ref Host}
  Bucket: {Value: !Ref Backups}
  ImageRepository: {Value: !GetAtt Images.RepositoryUri}
