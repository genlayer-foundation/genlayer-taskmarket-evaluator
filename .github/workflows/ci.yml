name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GENVM_VERSION: v0.6.0-rc10

jobs:
  lint-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-test.txt
      - run: genvm-lint check contracts/acp_evaluator.py

  test-direct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-test.txt
      - run: gltest tests/direct/ -v

  typecheck-and-test-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Check the public receipt projection
        run: python3 -m unittest discover -s deploy/aws -p 'test_*.py'
      - run: npm ci && npm run build
        working-directory: dashboard
